[package]
name = "signal_server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crypto_core = { path = "../protocol" }
hex = "0.4"
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { workspace = true }
thiserror = "2"
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["limit", "trace"] }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
